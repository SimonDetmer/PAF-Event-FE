<h2 class="text-2xl font-semibold">Cart</h2>

<div *ngIf="items && items.length > 0; else emptyCart">
  <div *ngFor="let it of items" class="mb-3">
    <div><strong>{{ it.title }}</strong></div>
    <div>Preis: {{ it.price }}</div>
    <div>
      Anzahl:
      <input type="number" min="1" [ngModel]="it.quantity" (ngModelChange)="order.updateQuantity(it.eventId, $event)" />
      <button mat-stroked-button color="warn" type="button" (click)="order.removeItem(it.eventId)">Entfernen</button>
    </div>
  </div>

  <h3>Ihre Daten</h3>
  <form [formGroup]="userForm" (ngSubmit)="orderTickets()">
    <label for="email">E-Mail:</label>
    <input id="email" type="email" formControlName="email">
    <div *ngIf="userForm.get('email')?.invalid && (userForm.get('email')?.touched || userForm.get('email')?.dirty)" class="error">
      <span *ngIf="userForm.get('email')?.errors?.['required']">E-Mail-Adresse ist erforderlich.</span>
      <span *ngIf="userForm.get('email')?.errors?.['email']">Bitte eine gültige E-Mail-Adresse eingeben.</span>
      <span *ngIf="userForm.get('email')?.errors?.['emailTaken']">
        Diese E-Mail-Adresse wird bereits verwendet. Daher wird diese Order dem entsprechenden User zugeordnet.
      </span>
    </div>

    <div class="mt-4">
      <button mat-flat-button color="primary" type="submit">Buy Tickets</button>
    </div>
  </form>
</div>

<ng-template #emptyCart>
  <p>Ihr Warenkorb ist leer.</p>
</ng-template>
