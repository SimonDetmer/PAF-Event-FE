<div class="p-4">

  <h2 class="text-xl font-semibold mb-4">Warenkorb</h2>

  <div *ngIf="items.length > 0; else empty">
    <div *ngFor="let it of items" class="mb-3">

      <mat-card>
        <mat-card-content>
          <div class="flex justify-between items-center">
            <div>
              <strong>{{ it.title }}</strong> <br>
              Preis: {{ it.price }} €
            </div>

            <div class="flex items-center gap-3">
              <input
                type="number"
                min="1"
                [value]="it.quantity"
                (change)="updateQty(it.eventId, $event)"
                class="border rounded p-1 w-20 text-right"
              />

              <button mat-stroked-button color="warn" (click)="removeItem(it.eventId)">
                Entfernen
              </button>
            </div>
          </div>
        </mat-card-content>
      </mat-card>

    </div>

    <h3 class="text-lg font-semibold mt-4">Kundendaten</h3>

    <form [formGroup]="userForm" (ngSubmit)="orderTickets()">

      <mat-form-field appearance="outline" class="w-full mt-3">
        <mat-label>E-Mail</mat-label>
        <input matInput formControlName="email" />
        <mat-error *ngIf="userForm.get('email')?.errors?.['required']">E-Mail erforderlich</mat-error>
        <mat-error *ngIf="userForm.get('email')?.errors?.['email']">Ungültige E-Mail</mat-error>
      </mat-form-field>

      <button mat-flat-button color="primary" class="mt-3" type="submit">
        Tickets kaufen
      </button>
    </form>
  </div>

  <ng-template #empty>
    <p>Warenkorb ist leer.</p>
  </ng-template>

</div>
