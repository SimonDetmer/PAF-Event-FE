<div class="login-container">
  <h2>Anmeldung</h2>

  <label for="email">E-Mail</label>
  <input
    id="email"
    type="email"
    placeholder="E-Mail eingeben"
    [(ngModel)]="email"
  />

  <button (click)="login()" [disabled]="loading || !email">
    <span *ngIf="!loading">Anmelden</span>
    <span *ngIf="loading">Wird angemeldet…</span>
  </button>

  <button type="button" (click)="goToRegister()">
    Noch kein Konto? Registrieren
  </button>

  <p *ngIf="message" style="color: green">{{ message }}</p>
  <p *ngIf="error" style="color: red">{{ error }}</p>
</div>
