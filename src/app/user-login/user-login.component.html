<div class="max-w-md mx-auto p-4 space-y-4">
  <h2>Anmelden</h2>

  <div>
    <label for="email" class="block font-medium mb-1">E-Mail</label>
    <input id="email" type="email" [(ngModel)]="email" name="email" class="w-full border rounded px-3 py-2" required>
  </div>

  <div *ngIf="error" class="text-red-600">{{ error }}</div>

  <div class="space-x-2">
    <button (click)="login()" [disabled]="loading">Login</button>
    <button (click)="createUser()" [disabled]="loading">Benutzer anlegen</button>
    <button (click)="cancel()" [disabled]="loading">Abbrechen</button>
  </div>
</div>
