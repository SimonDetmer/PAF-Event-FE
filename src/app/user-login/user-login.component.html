<div class="max-w-md mx-auto p-4 space-y-4">
  <h2 class="text-2xl font-bold mb-6">Anmelden</h2>

  <div class="mb-4">
    <label for="email" class="block font-medium mb-1">E-Mail</label>
    <input 
      id="email" 
      type="email" 
      [(ngModel)]="email" 
      name="email" 
      class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" 
      required
      [disabled]="loading"
    >
  </div>

  <div *ngIf="error" class="text-red-600 mb-4">
    {{ error }}
  </div>

  <div class="flex space-x-3">
    <button 
      (click)="login()" 
      [disabled]="loading"
      class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 disabled:bg-blue-300 flex-1"
    >
      Anmelden
    </button>
    
    <button 
      (click)="createUser()" 
      [disabled]="loading"
      class="px-4 py-2 border border-gray-300 rounded hover:bg-gray-100 disabled:bg-gray-100 flex-1"
    >
      Benutzer anlegen
    </button>
    
    <button 
      (click)="cancel()" 
      [disabled]="loading"
      class="px-4 py-2 border border-gray-300 rounded hover:bg-gray-100 disabled:bg-gray-100"
    >
      Abbrechen
    </button>
  </div>
</div>
