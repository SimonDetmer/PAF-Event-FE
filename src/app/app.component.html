<mat-toolbar color="primary" class="!sticky top-0 z-50">
  <button
    *ngIf="auth.isAuthenticated()"
    mat-icon-button
    (click)="toggleSidenav()"
    aria-label="Toggle navigation"
  >
    <mat-icon>menu</mat-icon>
  </button>

  <span class="pl-2 font-medium">EventM</span>
  <span class="flex-1"></span>

  <div class="flex items-center gap-4">
    <span class="text-sm opacity-90" *ngIf="auth.isAuthenticated() && currentUser">
      Eingeloggt als: <strong>{{ currentUser.email }}</strong>
    </span>

    <button
      *ngIf="auth.isAuthenticated()"
      mat-stroked-button
      color="warn"
      (click)="logout()"
      aria-label="Logout"
    >
      <mat-icon class="mr-1">logout</mat-icon>
      Logout
    </button>
  </div>
</mat-toolbar>

<mat-sidenav-container style="height: calc(100vh - 64px);">
  <mat-sidenav
    *ngIf="auth.isAuthenticated()"
    mode="side"
    [opened]="sidenavOpen"
    class="w-64"
  >
    <mat-nav-list>

      <a mat-list-item routerLink="/dashboard">
        <mat-icon matListItemIcon>dashboard</mat-icon>
        <span matListItemTitle>Dashboard</span>
      </a>

      <a mat-list-item routerLink="/event-overview">
        <mat-icon matListItemIcon>event</mat-icon>
        <span matListItemTitle>Event Overview</span>
      </a>

      <a
        mat-list-item
        routerLink="/locations"
        *ngIf="currentUser?.role === 'eventmanager'"
      >
        <mat-icon matListItemIcon>place</mat-icon>
        <span matListItemTitle>Locations verwalten</span>
      </a>

      <a mat-list-item routerLink="/ticket-buy">
        <mat-icon
          matListItemIcon
          [matBadge]="orderCount"
          matBadgeColor="accent"
          [matBadgeHidden]="orderCount === 0"
        >
          shopping_cart
        </mat-icon>
        <span matListItemTitle>Warenkorb</span>
      </a>

    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <main class="p-4 md:p-6 lg:p-8 max-w-7xl mx-auto w-full">
      <router-outlet></router-outlet>
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>

<app-loading-spinner></app-loading-spinner>
