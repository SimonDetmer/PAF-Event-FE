<div class="max-w-md mx-auto p-4 space-y-4">
  <h2>Benutzer anlegen</h2>

  <div>
    <label class="block font-medium mb-1">Rolle wählen</label>
    <label class="mr-4">
      <input type="radio" name="role" [(ngModel)]="selectedRole" value="eventmanager"> Eventmanager
    </label>
    <label>
      <input type="radio" name="role" [(ngModel)]="selectedRole" value="customer"> Customer
    </label>
  </div>

  <div>
    <label for="email" class="block font-medium mb-1">E-Mail</label>
    <input id="email" type="email" [(ngModel)]="email" name="email" class="w-full border rounded px-3 py-2" required>
  </div>

  <div class="space-x-2">
    <button (click)="createUser()" [disabled]="loading">Benutzer anlegen</button>
    <button (click)="cancel()" [disabled]="loading">Abbrechen</button>
  </div>
</div>
